<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwoTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>TwoTrack</h1>
      <p>Student Progress Tracker</p>
    </header>

    <main>
      <section>
        <h2>Dashboard</h2>
        <p>Students: <span id="student-count">0</span></p>
        <p>Lessons: <span id="lesson-count">0</span></p>
      </section>

      <section id="student-list">
        <!-- Students will appear here -->
      </section>

      <button id="add-student-btn">+ Add Student</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
