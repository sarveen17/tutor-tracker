<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TwoTrack</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>TwoTrack</h1>
      <p>Student Progress Tracker</p>
    </header>

    <main>
      <section>
        <h2>Dashboard</h2>
        <p>Students: <span id="std-count">0</span></p>
        <!-- <p>Lessons: <span id="lesson-count">0</span></p> -->
      </section>

      <section id="std-section">
        <h2>Students</h2>

        <input type="text" id="student-search" placeholder="Search..." />

        <label for="student-sort">Sort by:</label>
        <select id="student-sort">
          <option value="name-asc">Name: A → Z</option>
          <option value="name-desc">Name: Z → A</option>
        </select>

        <div id="std-list"></div>

        <form id="std-form">
          <h3>Add Student</h3>
          <input
            type="text"
            id="std-name"
            placeholder="Student name"
            required
          />
          <input type="text" id="std-subject" placeholder="Subject" required />
          <!-- <input
            type="number"
            id="std-average"
            placeholder="Average"
            min="0"
            max="100"
            step="0.01"
          /> -->
          <button type="submit">Add Student</button>
        </form>

        <form id="assessment-form">
          <h3>Add Assessment</h3>

          <select id="assessment-student" required>
            <option value="">Select student</option>
          </select>

          <input
            type="text"
            id="assessment-name"
            placeholder="Assessment name"
            required
          />

          <input
            type="number"
            id="assessment-score"
            placeholder="Score"
            min="0"
            max="100"
            step="0.01"
            required
          />

          <input type="date" id="assessment-date" required />

          <button type="submit">Add Assessment</button>
        </form>

        <form id="lesson-form">
          <h3>Add Lesson Notes</h3>

          <select id="lesson-student" required>
            <option value="">Select student</option>
          </select>

          <input type="date" id="lesson-date" required />

          <textarea
            id="lesson-note"
            placeholder="What was covered in this lesson?"
            rows="4"
            required
          ></textarea>

          <button type="submit">Add Lesson Note</button>
        </form>

        <form id="edit-form" hidden>
          <h3>Edit Student</h3>

          <input
            type="text"
            id="edit-name"
            placeholder="Student name"
            required
          />
          <input type="text" id="edit-subject" placeholder="Subject" required />
          <!-- <input
            type="number"
            id="edit-average"
            placeholder="Average"
            min="0"
            max="100"
            step="0.01"
          /> -->
          <button type="submit">Save Changes</button>
          <button type="button" id="cancel-edit">Cancel</button>
        </form>
      </section>

      <section id="student-view" hidden>
        <button id="back-to-students">← Back to Students</button>
        <div id="student-view-content"></div>

        <form id="edit-assessment-form" hidden>
          <h3>Edit Assessment</h3>

          <input
            type="text"
            id="edit-assessment-name"
            placeholder="Assessment name"
            required
          />
          <input
            type="number"
            id="edit-assessment-score"
            placeholder="Score"
            min="0"
            max="100"
            step="0.01"
            required
          />
          <input type="date" id="edit-assessment-date" required />
          <button type="submit">Save Changes</button>
          <button type="button" id="cancel-assessment-edit">Cancel</button>
        </form>

        <form id="edit-lesson-form" hidden>
          <h3>Edit Lesson</h3>

          <input type="date" id="edit-lesson-date" required />
          <textarea id="edit-lesson-note"></textarea>
          <button type="submit">Save Changes</button>
          <button type="button" id="cancel-lesson-edit">Cancel</button>
        </form>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
